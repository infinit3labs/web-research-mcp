name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Deterministic tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run deterministic unit and contract matrix with coverage
        run: |
          coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          coverage report --show-missing
          coverage xml -o coverage-${{ matrix.python-version }}.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml

  package:
    name: Build validation and installed-package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the built wheel into a clean environment
        run: |
          python -m venv /tmp/install-check
          /tmp/install-check/bin/pip install --upgrade pip
          /tmp/install-check/bin/pip install dist/*.whl

      - name: Smoke test the installed console script over MCP stdio
        run: |
          export PATH="/tmp/install-check/bin:$PATH"
          /tmp/install-check/bin/python -m unittest tests.test_packaging.InstalledConsoleScriptSmokeTest -v

  integration:
    name: Opt-in live protocol smoke test
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run opt-in live protocol smoke suite
        env:
          WEB_RESEARCH_RUN_LIVE_INTEGRATION: "1"
        run: python -m unittest tests.test_live_protocol
