name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Offline, mocked-network coverage of provider parsing, retry/backoff,
      # SSRF validation, and the deep-research heuristics. No secrets needed.
      - name: Run unit test suite
        run: python -m pytest tests/ --ignore=tests/e2e_protocol.py -v

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run e2e test suite
        env:
          # CI runs without API keys — exercises the keyless path of every tool
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY:  ${{ secrets.BRAVE_API_KEY }}
          JINA_API_KEY:   ${{ secrets.JINA_API_KEY }}
        run: python tests/e2e_protocol.py
