[project]
name = "web-research-mcp"
version = "0.1.0"
description = "High-quality web research MCP server (multi-source, ToS-friendly, anti-bot via real APIs)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
]

[project.scripts]
web-research-mcp = "web_research.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_research"]
